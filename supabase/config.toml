[functions.experiment-api]
# Report self-test and research routes retain confirmed owner authentication.
# Alien Zoo /game/access issues a short-lived, game-only capability; /game/chat
# verifies its scope, session and group, and applies daily/session/minute limits.
# It grants no database read or researcher access. AI secrets remain server-side.
verify_jwt = false

[functions.research-api]
# This read-only service validates Auth.getUser, confirmed owner email and UUID
# membership inside the function. It exposes no participant or AI operations.
verify_jwt = false
