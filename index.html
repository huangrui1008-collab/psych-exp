<style>
:root { color-scheme:light; font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif; color:#20302a; background:#f5f7f4; font-size:15px; }
*{box-sizing:border-box} body{margin:0} button,input,select,textarea{font:inherit}
header{background:#244f45;color:#fff;padding:15px max(20px,calc((100vw - 1060px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}header h1{font-size:20px;font-weight:650;margin:0}header small{opacity:.85}
main{max-width:1060px;margin:22px auto;padding:0 18px}h2{font-size:20px;margin:0 0 14px}h3{font-size:16px;margin:0 0 9px}p{line-height:1.65;margin:9px 0}button{background:#256b57;color:white;border:none;border-radius:9px;padding:11px 15px;cursor:pointer;font-weight:600}button.secondary{background:#e8eee9;color:#24453d}button.ghost{background:transparent;color:#256b57;border:1px solid #a6c3b4}button:hover:not(:disabled){filter:brightness(.96)}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d49b4b;outline-offset:2px}
.card{background:#fff;border:1px solid #dce6dc;border-radius:13px;padding:22px;margin-bottom:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1.15fr .9fr;gap:16px}.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.group{padding:18px;border:1px solid #d7e2d7;border-radius:11px;background:#fbfcfa}.group h3{margin:0 0 7px}.muted,small{font-size:13px;color:#65766c}.tag{font-size:12px;color:#59766a;font-weight:700;letter-spacing:.3px}.notice{background:#f0f4ef;border-left:3px solid #7d9a84;padding:12px 15px;border-radius:5px;margin:14px 0}.error{color:#b0261b;font-size:13px}.success{color:#17744b}
.goal{background:#eef6ed;border:1px solid #d7e5d4;border-radius:10px;padding:15px;margin-bottom:16px}.meter{height:9px;background:#d2ddd2;border-radius:9px;overflow:hidden;margin:10px 0}.meter>span{display:block;background:#28725a;height:100%;transition:width .25s}.large{font-size:30px;font-weight:750}.pill{display:inline-block;border:1px solid #cdded1;border-radius:30px;padding:5px 9px;font-size:12px;color:#446357;background:#f9fbfa}
.plants{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:17px 0}.plant{text-align:center;border:1px solid #d6e2d6;background:#fbfcf9;border-radius:11px;padding:10px 5px}.plant b{display:block;font-size:13px}.plant .icon{display:block;font-size:31px;margin:5px 0}.plant input{width:60px;max-width:100%;text-align:center;padding:8px 0;border:1px solid #aebdad;border-radius:7px;background:white}.plant span.note{font-size:11px;color:#68796c;display:block;margin-top:3px}
.zoo{background:#eaf4e4;border-radius:12px;padding:15px;min-height:120px;margin:13px 0}.creatures{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start}.critter{font-size:17px;border-radius:50%;background:#bad7ac;width:25px;height:25px;text-align:center;line-height:25px;color:#274e35}.critter.fresh{background:#f2d98a;animation:pop .3s ease-out}@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}.delta{font-size:14px;font-weight:700}.delta.up{color:#16724e}.delta.down{color:#c34b36}
.ai{background:#f0f5f1;border:1px solid #d4e3d7;border-radius:11px;padding:16px;margin:14px 0}.ai h3{margin-bottom:8px}.ai p{margin:6px 0}.ai .source{font-size:12px;color:#63796c}.ai.pending{opacity:.73}.questions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.question{background:#fff;border:1px solid #bfd1c4;color:#244b3c;padding:12px;text-align:left}.question.selected{border:2px solid #287b5b;background:#e2efe6;padding:11px}.recipe-mini{display:flex;gap:6px;flex-wrap:wrap}.food{display:inline-flex;gap:5px;align-items:center;background:#f3f6f1;border:1px solid #d8e2d4;border-radius:7px;padding:5px 7px;white-space:nowrap;font-size:12px}.food b{font-size:13px}.food .emoji{font-size:18px}
.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px 7px;border-bottom:1px solid #e7ebe6;font-size:13px;text-align:left;vertical-align:top}th{color:#637568}.table-recipes{min-width:520px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.test-row{border:1px solid #dce5d9;border-radius:9px;padding:12px;margin:10px 0}.test-row label{display:block;font-weight:650;margin-bottom:8px}.choices{display:flex;gap:9px;flex-wrap:wrap}.choices label{font-weight:400;display:flex;align-items:center;gap:4px;padding:5px 6px}.test-row select{min-width:130px;padding:7px;border:1px solid #c3d1c3;border-radius:7px;background:white}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.settings label{display:block;font-size:13px;font-weight:650}.settings select,.settings input[type=url]{display:block;width:100%;margin-top:6px;padding:9px;border:1px solid #b8cabb;border-radius:7px;background:white}.settings input[type=checkbox]{margin-right:6px}details{margin:12px 0}summary{cursor:pointer;font-weight:650}.lock{background:#fff5ed;border-color:#efd9c3}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#204c3e;color:#fff;padding:10px 16px;border-radius:8px;z-index:20;display:none;max-width:92vw}.divider{height:1px;background:#e5ece5;margin:16px 0}footer{max-width:1060px;margin:20px auto;padding:12px 18px;color:#63746b;font-size:12px;text-align:center}
@media(max-width:720px){.grid,.groups,.settings{grid-template-columns:1fr}.card{padding:16px}.plants{gap:5px}.plant{padding:7px 2px}.plant b{font-size:11px}.plant .icon{font-size:24px}.plant input{width:43px}.questions{grid-template-columns:1fr}.creatures{gap:2px}.critter{font-size:15px;width:22px;height:22px;line-height:22px}header h1{font-size:17px}}
header small{color:#e0eee7;opacity:1}[hidden]{display:none!important}.preview-links a{color:#fff;margin-left:12px;font-size:13px}#gameConnection{max-width:1024px;margin:18px auto}#gameLoginForm label{display:block}#gameLoginForm input{padding:9px;border:1px solid #b8cabb;border-radius:7px;max-width:100%}
</style>
