<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商业策略报告撰写实验</title>
<style>
  /* ========== 基础样式 ========== */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
  }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  /* ========== 顶部区域 ========== */
  header {
    background: #ffffff;
    border-bottom: 1px solid #dfe2e6;
    padding: 16px 24px;
  }
  header h1 {
    font-size: 18px;
    margin: 0 0 8px 0;
    color: #1a2b4c;
    font-weight: 600;
  }
  .task-desc {
    font-size: 14px;
    line-height: 1.7;
    color: #333;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 10px;
  }
  .condition-banner {
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: 500;
  }
  .condition-banner.group-a {
    background: #fff4e5;
    border: 1px solid #f5c98f;
    color: #8a5a00;
  }
  .condition-banner.group-b {
    background: #e8f1ff;
    border: 1px solid #a9c8f7;
    color: #1a4a8a;
  }
  .condition-banner.group-err {
    background: #fdeaea;
    border: 1px solid #f3b3b3;
    color: #a30000;
  }

  /* ========== 中间主体：左右两栏 ========== */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px 24px;
    min-height: 0;
  }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: #ffffff;
    border: 1px solid #dfe2e6;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    min-height: 480px;
    overflow: hidden;
  }
  .panel-header {
    padding: 10px 16px;
    border-bottom: 1px solid #e5e7eb;
    font-size: 14px;
    font-weight: 600;
    color: #1a2b4c;
    background: #fafbfc;
  }

  /* ---------- 左栏：AI对话 ---------- */
  #chatMessages {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 9px 13px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #2b6cb0;
    color: #fff;
    border-bottom-right-radius: 3px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #f1f3f5;
    color: #222;
    border-bottom-left-radius: 3px;
  }
  .typing-dots {
    align-self: flex-start;
    background: #f1f3f5;
    padding: 12px 16px;
    border-radius: 10px;
    border-bottom-left-radius: 3px;
    display: flex;
    gap: 4px;
  }
  .typing-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #999;
    display: inline-block;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  .chat-input-area {
    border-top: 1px solid #e5e7eb;
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  #chatInput {
    flex: 1;
    resize: none;
    border: 1px solid #d0d5dc;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    min-height: 40px;
    max-height: 120px;
    outline: none;
  }
  #chatInput:focus { border-color: #2b6cb0; }
  #sendBtn {
    background: #2b6cb0;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  #sendBtn:hover { background: #235a92; }
  #sendBtn:disabled { background: #b9c3cf; cursor: not-allowed; }

  /* ---------- 右栏：报告撰写 ---------- */
  #essayText {
    flex: 1;
    border: none;
    resize: none;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.8;
    font-family: inherit;
    outline: none;
  }
  .essay-footer {
    border-top: 1px solid #e5e7eb;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fafbfc;
  }
  #wordCountLabel {
    font-size: 13px;
    color: #666;
  }
  #wordCountLabel.enough { color: #1a7d3a; font-weight: 600; }
  #submitBtn {
    border: none;
    border-radius: 6px;
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: #b9c3cf;
    cursor: not-allowed;
    transition: background 0.2s;
  }
  #submitBtn.active {
    background: #1a7d3a;
    cursor: pointer;
  }
  #submitBtn.active:hover { background: #145e2c; }

  /* ========== 底部计时区域 ========== */
  footer {
    padding: 8px 24px;
    font-size: 12px;
    color: #888;
    background: #fff;
    border-top: 1px solid #dfe2e6;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<!-- ========================================================= -->
<!-- 配置说明：本页面为静态实验页面，所有可调参数集中在下方 <script> 的
     CONFIG 对象中，部署前请务必检查并填写。                        -->
<!-- ========================================================= -->

<header>
  <h1>商业策略报告撰写任务</h1>
  <div class="task-desc" id="taskDesc"></div>
  <div class="condition-banner" id="conditionBanner"></div>
</header>

<main>
  <!-- 左栏：AI 对话 -->
  <section class="panel">
    <div class="panel-header">AI 助手对话</div>
    <div id="chatMessages"></div>
    <div class="chat-input-area">
      <textarea id="chatInput" placeholder="请输入内容，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </section>

  <!-- 右栏：报告撰写 -->
  <section class="panel">
    <div class="panel-header">策略建议报告撰写区</div>
    <textarea id="essayText" placeholder="请在此撰写您的策略建议报告（600-1000字）..."></textarea>
    <div class="essay-footer">
      <span id="wordCountLabel">已输入 0 字</span>
      <button id="submitBtn" disabled>提交报告</button>
    </div>
  </section>
</main>

<footer>
  <span id="elapsedTime">已进行 0 分钟</span>
  <span id="groupInfo"></span>
</footer>

<script>
/* =========================================================================
   ============================ 配置区（务必检查） ============================
   部署前请修改以下参数：
   1. API_KEY            —— DeepSeek 平台申请的 API Key
   2. NEXT_URL            —— 提交完成后跳转的后测问卷地址
   3. SUPABASE_URL/KEY    —— Supabase 项目地址与匿名 Key（用于保存被试数据）
   其余参数（系统提示词、任务说明文案等）可根据实验设计按需调整。
   ========================================================================= */
const CONFIG = {
  // DeepSeek API 相关配置
  API_URL: "https://api.deepseek.com/chat/completions",
  API_KEY: "sk-74dedd9ad1094a92b8622e60b2e09b6a",
  MODEL: "deepseek-chat",

  // 后测问卷跳转地址（会自动附加 ?pid=xxx&group=xxx）
  NEXT_URL: "https://v.wjx.cn/vm/wF8mCZ8.aspx",

  // Supabase 配置（用于在线保存被试数据，替代/补充 localStorage）
  SUPABASE_URL: "https://moryybvgocdtevhmaqyd.supabase.co",
  SUPABASE_KEY: "sb_publishable_21Z7blesl0YSfgswqDbZ0w_WtpnDnYC",
  SUPABASE_TABLE: "experiment_data",   // Supabase 数据表名

  // 报告最低字数要求（按汉字字符数统计）
  MIN_WORDS: 600,

  // 顶部任务说明文案
  TASK_DESCRIPTION: "请以商业咨询顾问身份，针对宜家进入中国二手家具市场撰写策略建议报告（600-1000字），涵盖：①商业模式对比（至少两种）②品牌定位建议 ③整合策略。",

  // 两组的条件横幅文案
  BANNER_TEXT: {
    A: "AI将直接生成报告初稿，请仔细审阅后在右侧完善提交",
    B: "AI只提供引导不生成全文，请您主导完成报告撰写"
  },

  // 两组的系统提示词（决定 AI 的行为方式）
  SYSTEM_PROMPT: {
    A: "你是一位经验丰富的商业咨询专家，负责直接为用户完成报告撰写。规则：当用户描述任务需求时，立即生成完整的600-1000字策略报告，包含商业模式对比、品牌定位和整合策略三个部分。直接输出报告正文，不要询问更多问题，不要只给框架。用户只需核对和小幅润色后即可提交。任务：宜家进入中国二手家具市场的策略分析报告。",
    B: "你是一位严格的学习引导助手，绝对不能替用户写报告。规则：①绝对禁止生成完整报告段落；②当用户要求直接生成时，礼貌拒绝并引导思考；③只能做：提出启发性问题、提供逻辑框架、给予简短反馈、指出逻辑漏洞；④每次回复不超过120字；⑤始终让用户处于认知主导地位。"
  },

  // 两组 AI 的首条开场消息（不调用 API，直接展示）
  FIRST_MESSAGE: {
    A: "您好，我是您的商业咨询专家。请简单描述一下您希望报告重点关注的方向（例如商业模式选择、品牌定位思路等），我将为您生成完整的策略报告初稿，供您审阅和完善。",
    B: "您好，在开始撰写之前，我想先了解一下：关于宜家进入中国二手家具市场，您目前有哪些初步的想法或思路？"
  }
};
/* =========================================================================
   ============================ 配置区结束 ============================
   ========================================================================= */

// ---------- 读取 URL 参数 ----------
const urlParams = new URLSearchParams(window.location.search);
let group = (urlParams.get("group") || "").toUpperCase();
const pid = urlParams.get("pid") || ("anon_" + Math.random().toString(36).slice(2, 10));

const bannerEl = document.getElementById("conditionBanner");
const taskDescEl = document.getElementById("taskDesc");
taskDescEl.textContent = CONFIG.TASK_DESCRIPTION;
document.getElementById("groupInfo").textContent = "被试编号：" + pid + "　分组：" + (group || "未知");

// 校验分组参数是否合法，非法则提示并停止初始化对话功能
let validGroup = (group === "A" || group === "B");
if (!validGroup) {
  bannerEl.className = "condition-banner group-err";
  bannerEl.textContent = "URL 缺少有效的 group 参数（应为 ?group=A 或 ?group=B），请检查实验链接。";
} else {
  bannerEl.className = "condition-banner group-" + group.toLowerCase();
  bannerEl.textContent = CONFIG.BANNER_TEXT[group];
}

// ---------- 全局状态 ----------
const startTime = Date.now(); // 实验开始时间戳，用于计算时长
// 对话记录：包含系统提示词、开场白及后续所有轮次，最终随提交数据一并保存
let chatHistory = validGroup ? [
  { role: "system", content: CONFIG.SYSTEM_PROMPT[group] },
  { role: "assistant", content: CONFIG.FIRST_MESSAGE[group] }
] : [];

// ---------- DOM 元素 ----------
const chatMessages = document.getElementById("chatMessages");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");
const essayText = document.getElementById("essayText");
const wordCountLabel = document.getElementById("wordCountLabel");
const submitBtn = document.getElementById("submitBtn");
const elapsedTimeEl = document.getElementById("elapsedTime");

// ---------- 初始化对话区 ----------
function renderMessage(role, content) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "assistant");
  div.textContent = content;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

if (validGroup) {
  renderMessage("assistant", CONFIG.FIRST_MESSAGE[group]);
} else {
  chatInput.disabled = true;
  sendBtn.disabled = true;
  chatInput.placeholder = "分组参数无效，对话功能已禁用";
}

// ---------- 打字动画 ----------
let typingIndicator = null;
function showTyping() {
  typingIndicator = document.createElement("div");
  typingIndicator.className = "typing-dots";
  typingIndicator.innerHTML = "<span></span><span></span><span></span>";
  chatMessages.appendChild(typingIndicator);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}
function hideTyping() {
  if (typingIndicator) {
    typingIndicator.remove();
    typingIndicator = null;
  }
}

// ---------- 调用 DeepSeek API ----------
async function callDeepSeekAPI() {
  if (CONFIG.API_KEY === "YOUR_API_KEY_HERE") {
    hideTyping();
    renderMessage("assistant", "【系统提示】尚未配置 API Key，请在页面配置区填写有效的 DeepSeek API Key 后重试。");
    return;
  }
  try {
    const response = await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + CONFIG.API_KEY
      },
      body: JSON.stringify({
        model: CONFIG.MODEL,
        messages: chatHistory.map(m => ({ role: m.role, content: m.content }))
      })
    });
    if (!response.ok) {
      throw new Error("API 请求失败，状态码：" + response.status);
    }
    const data = await response.json();
    const reply = data.choices && data.choices[0] && data.choices[0].message
      ? data.choices[0].message.content
      : "（未获取到有效回复）";
    hideTyping();
    chatHistory.push({ role: "assistant", content: reply });
    renderMessage("assistant", reply);
  } catch (err) {
    hideTyping();
    renderMessage("assistant", "【网络错误】未能获取回复，请检查网络或稍后重试。（" + err.message + "）");
  }
}

// ---------- 发送消息 ----------
function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || !validGroup) return;
  chatHistory.push({ role: "user", content: text });
  renderMessage("user", text);
  chatInput.value = "";
  chatInput.style.height = "auto";
  showTyping();
  callDeepSeekAPI();
}

sendBtn.addEventListener("click", sendMessage);
chatInput.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
// 输入框随内容自适应高度
chatInput.addEventListener("input", function () {
  chatInput.style.height = "auto";
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + "px";
});

// ---------- 右栏字数统计 ----------
function countChineseChars(str) {
  const matches = str.match(/[一-龥]/g);
  return matches ? matches.length : 0;
}

function updateWordCount() {
  const count = countChineseChars(essayText.value);
  if (count >= CONFIG.MIN_WORDS) {
    wordCountLabel.textContent = "已输入 " + count + " 字（已达到最低要求）";
    wordCountLabel.classList.add("enough");
    submitBtn.disabled = false;
    submitBtn.classList.add("active");
    submitBtn.textContent = "提交报告";
  } else {
    const remaining = CONFIG.MIN_WORDS - count;
    wordCountLabel.textContent = "已输入 " + count + " 字";
    wordCountLabel.classList.remove("enough");
    submitBtn.disabled = true;
    submitBtn.classList.remove("active");
    submitBtn.textContent = "还需 " + remaining + " 字";
  }
}
essayText.addEventListener("input", updateWordCount);
updateWordCount();

// ---------- 提交报告 ----------
function appendUrlParams(url, params) {
  const separator = url.indexOf("?") === -1 ? "?" : "&";
  const query = Object.keys(params)
    .map(k => encodeURIComponent(k) + "=" + encodeURIComponent(params[k]))
    .join("&");
  return url + separator + query;
}

// 将数据 POST 到 Supabase；未配置或请求失败都不抛出异常，仅在控制台记录错误
async function submitToSupabase(record) {
  if (CONFIG.SUPABASE_URL === "YOUR_SUPABASE_URL" || CONFIG.SUPABASE_KEY === "YOUR_SUPABASE_KEY") {
    console.error("[Supabase] 尚未配置 SUPABASE_URL / SUPABASE_KEY，数据仅保存在 localStorage。");
    return;
  }
  try {
    const response = await fetch(CONFIG.SUPABASE_URL + "/rest/v1/" + CONFIG.SUPABASE_TABLE, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": CONFIG.SUPABASE_KEY,
        "Authorization": "Bearer " + CONFIG.SUPABASE_KEY,
        "Prefer": "return=minimal"
      },
      // 注意：Postgres 中 group 是保留字，这里用 group_name 作为列名
      body: JSON.stringify({
        pid: record.pid,
        group_name: record.group,
        essay: record.essay,
        chat_history: record.chatHistory,
        duration: record.duration,
        timestamp: record.timestamp
      })
    });
    if (!response.ok) {
      const errText = await response.text();
      throw new Error("HTTP " + response.status + "：" + errText);
    }
  } catch (err) {
    console.error("[Supabase] 数据提交失败，已降级为仅本地保存：", err);
  }
}

submitBtn.addEventListener("click", async function () {
  if (submitBtn.disabled) return;
  submitBtn.disabled = true;
  submitBtn.textContent = "提交中...";

  const durationSeconds = Math.round((Date.now() - startTime) / 1000);
  const record = {
    pid: pid,
    group: group,
    essay: essayText.value,
    chatHistory: chatHistory,
    duration: durationSeconds,
    timestamp: new Date().toISOString()
  };
  // 无论 Supabase 是否提交成功，都先在本地保存一份作为兜底备份
  localStorage.setItem("psychExpData_" + pid, JSON.stringify(record));

  await submitToSupabase(record);

  const nextUrl = appendUrlParams(CONFIG.NEXT_URL, { pid: pid, group: group });
  window.location.href = nextUrl;
});

// ---------- 底部计时（左下角，每30秒更新一次） ----------
function updateElapsedTime() {
  const minutes = Math.floor((Date.now() - startTime) / 60000);
  elapsedTimeEl.textContent = "已进行 " + minutes + " 分钟";
}
updateElapsedTime();
setInterval(updateElapsedTime, 30000);
</script>
</body>
</html>
